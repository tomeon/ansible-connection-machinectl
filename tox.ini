[tox]
requires =
    tox>=4.22
    tox-uv>=1.13

# Each ansible-core release on the newest Python it supports on the controller.
# tox-uv fetches missing interpreters.
env_list =
    py312-ansible{216,217}
    py313-ansible{218,219}
    py314-ansible{220,221}
    py315-ansible222

no_package = true

[testenv]
skip_install = true

deps =
    coverage
    ansible216: ansible-core>=2.16,<2.17
    ansible217: ansible-core>=2.17,<2.18
    ansible218: ansible-core>=2.18,<2.19
    ansible219: ansible-core>=2.19,<2.20
    ansible220: ansible-core>=2.20,<2.21
    ansible221: ansible-core>=2.21,<2.22
    ansible222: ansible-core>=2.22,<2.23

set_env =
    ANSIBLE_CONFIG = {tox_root}{/}ansible.cfg
    ANSIBLE_FORCE_COLOR = {tty:1:0}
    COVERAGE_FILE = {env_dir}{/}.coverage
    PYTHONPATH = {tox_root}{:}{env:PYTHONPATH:}
    PYTHONUNBUFFERED = 1
    PYTHONWARNINGS = default::DeprecationWarning

pass_env =
    ANSIBLE_DEBUG
    CI
    GITHUB_*

commands_pre =
    - coverage erase

# scripts/run-tests sets MACHINECTL_TEST_RUN_ID, so that the tests target
# only the guests it imported for this run; without it, they target every
# running machine.
commands =
    coverage run {env_bin_dir}{/}ansible-playbook -vv \
        -i {tox_root}{/}contrib{/}inventory \
        -e test_run_id={env:MACHINECTL_TEST_RUN_ID:} \
        {tox_root}{/}tests{/}test.yml \
        {posargs}

commands_post =
    - coverage combine
    - coverage report

# Ansible runs the connection plugin in forked worker processes, so coverage
# has to follow them (which it only does with settings from a configuration
# file) and combine the results afterwards.
[coverage:run]
concurrency = multiprocessing
parallel = true
source = connection_plugins
